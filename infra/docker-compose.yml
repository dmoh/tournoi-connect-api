# Services locaux : pnpm infra:up
name: tournoi-connect
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: tournoi
      POSTGRES_PASSWORD: tournoi
      POSTGRES_DB: tournoi_connect
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tournoi -d tournoi_connect']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tournoi
      MINIO_ROOT_PASSWORD: tournoi-secret
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
