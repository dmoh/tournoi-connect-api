packages:
  - apps/*
  - packages/*

overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS, élevée) : effect <= 3.22.0, tiré par prisma > @prisma/config.
  # Version corrigée de la même majeure ; à retirer quand Prisma la tirera lui-même.
  effect: 3.22.4
minimumReleaseAgeExclude:
  - '@nestjs/common@12.4.2'
  - '@nestjs/core@12.4.2'
  - '@nestjs/platform-fastify@12.4.2'
  - '@nestjs/testing@12.4.2'

# Scripts d'installation refusés par défaut ; @scarf/scarf n'est que de la télémétrie.
allowBuilds:
  '@scarf/scarf': false
  # Prisma télécharge son moteur de migration à l'installation (ADR-003).
  '@prisma/engines': true
  prisma: true
  # Accélérateur natif facultatif de BullMQ : la version JS suffit.
  msgpackr-extract: false
