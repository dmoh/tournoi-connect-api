packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@nestjs/common@12.4.2'
  - '@nestjs/core@12.4.2'
  - '@nestjs/platform-fastify@12.4.2'
  - '@nestjs/testing@12.4.2'

# Scripts d'installation refusés par défaut ; @scarf/scarf n'est que de la télémétrie.
allowBuilds:
  '@scarf/scarf': false
  # Prisma télécharge son moteur de migration à l'installation (ADR-003).
  '@prisma/engines': true
  prisma: true
  # Accélérateur natif facultatif de BullMQ : la version JS suffit.
  msgpackr-extract: false
