name: CD

# main  -> image publiée sur GHCR puis déploiement en homologation
# v*    -> image versionnée, paquets npm publiés, déploiement en production
#          (validation manuelle via l'environnement GitHub « production »)
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Image Docker → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=production,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  packages:
    name: Paquets npm → GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@dmoh'
      - run: pnpm install --frozen-lockfile
      - name: Aligner la version des paquets sur le tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter "./packages/engine" --filter "./packages/contracts" exec npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: pnpm --filter "./packages/engine" --filter "./packages/contracts" build
      - run: pnpm --filter "./packages/engine" --filter "./packages/contracts" publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Déploiement homologation
    needs: image
    # Ignoré tant que la variable de dépôt AWS_ROLE_ARN n'est pas définie.
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image-tag: ${{ github.sha }}
    permissions:
      id-token: write
      contents: read
      packages: read

  deploy-production:
    name: Déploiement production
    needs: [image, packages]
    if: startsWith(github.ref, 'refs/tags/v') && vars.AWS_ROLE_ARN != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image-tag: ${{ github.sha }}
    permissions:
      id-token: write
      contents: read
      packages: read
