name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tournoi
          POSTGRES_PASSWORD: tournoi
          POSTGRES_DB: tournoi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournoi -d tournoi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Base éphémère du job, sans donnée réelle.
      DATABASE_URL: postgresql://tournoi:tournoi@localhost:5432/tournoi_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Migrations (échec si une migration ne s'applique pas)
        run: pnpm db:deploy
      - name: Migrations à jour avec le schéma
        run: pnpm --filter @tournoi-connect/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Tests e2e (Postgres)
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
      - name: Contrat OpenAPI à jour
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json packages/contracts \
            || (echo "::error::Le contrat OpenAPI a changé : lancer 'pnpm openapi' et commiter le résultat." && exit 1)

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  docker:
    name: Build de l'image (sans publication)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform (format et validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      # Sans backend : la CI ne lit ni n'écrit l'état.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Script de déploiement de l'hôte
        run: shellcheck host/deploy.sh
